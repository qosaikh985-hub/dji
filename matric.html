<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matric - موقع الفيديوهات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="https://d1sna5nqfbu5hd.cloudfront.net/dji-logo.svg" alt="DJI Logo">
        </div>
        <h1>Matric</h1>
        <nav>
            <a href="index.html">العودة للرئيسية</a>
        </nav>
    </header>

    <main>
        <div class="options">
            <div class="option">
                <h3>Matrice 30t</h3>
                <div class="videos">
                    <!-- أضف روابط الفيديوهات هنا -->
                </div>
            </div>
            <div class="option">
                <h3>Matrice 30</h3>
                <div class="videos">
                    <!-- أضف روابط الفيديوهات هنا -->
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 موقع الفيديوهات</p>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const playButtons = document.querySelectorAll('.play-button');
            playButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const container = this.closest('.video-container');
                    const videoId = container.getAttribute('data-video');
                    const start = container.getAttribute('data-start');
                    let url = `https://www.youtube.com/watch?v=${videoId}`;
                    if (start) {
                        url += `&t=${start}s`;
                    }
                    window.open(url, '_blank');
                });
            });
        });
    </script>
</body>
</html>
